    <script>
      if (location.pathname === '/work' || location.pathname === '/work/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/webp';
        l.setAttribute('imagesrcset', '/work/wirebird-640.webp 640w, /work/wirebird-1280.webp 1280w');
        l.setAttribute('imagesizes', '(min-width: 1152px) 616px, (min-width: 768px) 53vw, calc(90vw - 24px)');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
