<!doctype html>
<html lang="en-AU" data-time="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Three off-grid cabins in a quiet gully near Rathdowney, under Mount Barney. A fictional demo site by FieldBourne Digital." />
    <title>Lantern Gully Cabins</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B4461E'/%3E%3Crect x='11' y='9' width='10' height='14' fill='%23F4EEE4'/%3E%3C/svg%3E" />
    <link rel="preload" href="./assets/fonts/Outfit.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/Figtree.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Set the light of the page from the visitor's local time before first paint.
      // A ?time=dawn|day|dusk|night query lets anyone preview the other states.
      (function () {
        var t = 'day'
        try {
          var q = new URLSearchParams(location.search).get('time')
          var h = new Date().getHours()
          t = h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 16 ? 'day' : h >= 16 && h < 19 ? 'dusk' : 'night'
          if (q === 'dawn' || q === 'day' || q === 'dusk' || q === 'night') t = q
        } catch (e) {}
        document.documentElement.setAttribute('data-time', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
